# Codex の共有設定。/etc/codex/config.toml からこのファイルを参照する。
# ~/.codex/config.toml は Codex が更新するローカル状態として別管理する。
model = "gpt-6-astra"
model_reasoning_effort = "max"
personality = "pragmatic"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
approval_policy = "never"

[agents]
default_subagent_model = "gpt-5.6-sol"

[skills]
max_context_tokens = 8500

[tui]
status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch", "pull-request-number", "used-tokens", "model", "branch-changes", "context-remaining", "context-used", "five-hour-limit", "task-progress"]
status_line_use_colors = true
pet = "null-signal"
theme = "monokai-extended"

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[marketplaces.cloudflare]
source_type = "git"
source = "https://github.com/cloudflare/skills.git"

[marketplaces.openai-codex]
source_type = "git"
source = "https://github.com/openai/codex-plugin-cc.git"

[marketplaces.sen-marketplace]
source_type = "git"
source = "https://github.com/sen-corporation/claude-code-plugins.git"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."figma@claude-plugins-official"]
enabled = true

[plugins."pr-review-toolkit@claude-plugins-official"]
enabled = true

[plugins."skill-creator@claude-plugins-official"]
enabled = true

[plugins."slack@claude-plugins-official"]
enabled = true

[plugins."codex@openai-codex"]
enabled = true

[plugins."cheese-design-system@sen-marketplace"]
enabled = true

[plugins."reviewing-skills@sen-marketplace"]
enabled = true

[plugins."code-simplifier@claude-plugins-official"]
enabled = true

[plugins."commit-commands@claude-plugins-official"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."gopls-lsp@claude-plugins-official"]
enabled = true

[plugins."typescript-lsp@claude-plugins-official"]
enabled = true

[plugins."cloudflare@cloudflare"]
enabled = true

[plugins."php-lsp@claude-plugins-official"]
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

[features]
hooks = true
js_repl = false
terminal_resize_reflow = true
memories = true

[mcp_servers.cheese]
command = "npx"
args = ["-y", "@sen-corporation/cheese-mcp-server@latest"]
cwd = "/tmp"
startup_timeout_sec = 30
enabled = true
env_vars = ["GITHUB_TOKEN", "NPM_TOKEN"]

[mcp_servers.cheese.tools.list_components]
approval_mode = "approve"

[mcp_servers.cheese.tools.get_component]
approval_mode = "approve"

[mcp_servers.cheese.tools.search]
approval_mode = "approve"

[mcp_servers.cheese.tools.get_figma_code_connect]
approval_mode = "approve"

[mcp_servers.cheese.tools.list_icons]
approval_mode = "approve"

[mcp_servers.cheese.tools.list_tokens]
approval_mode = "approve"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--autoConnect"]
cwd = "/tmp"
startup_timeout_sec = 30
enabled = true

[mcp_servers.chrome-devtools.tools.navigate_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.click]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.evaluate_script]
approval_mode = "approve"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
cwd = "/tmp"
startup_timeout_sec = 30
enabled = true

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.home-memo]
url = "https://home-memo-mcp.burio16.com/mcp"
enabled = true
enabled_tools = ["search_knowledge"]
env_http_headers = { "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID", "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET" }
default_tools_approval_mode = "approve"

[mcp_servers.work-memo]
url = "https://work-memo-mcp.burio16.com/mcp"
enabled = true
enabled_tools = ["search_knowledge"]
env_http_headers = { "CF-Access-Client-Id" = "CF_ACCESS_CLIENT_ID", "CF-Access-Client-Secret" = "CF_ACCESS_CLIENT_SECRET" }
default_tools_approval_mode = "approve"

[mcp_servers.tacos]
url = "https://tacos.burio16.com/mcp"
enabled = true
default_tools_approval_mode = "approve"

[desktop.open-in-target-preferences]
global = "ghostty"
